name: Validate GREENdaSORTE

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "improvement/**"]

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML pages and JavaScript syntax
        run: node scripts/validate.js
